name: 更新股價與匯率
on:
  schedule:
    - cron: '30 7 * * 1-5'   # 台灣時間週一到週五 15:30（收盤後）
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - run: python3 tools/update_prices.py
      - name: 有變動才存檔
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --cached --quiet || (git commit -m "更新股價與匯率" && git push)
